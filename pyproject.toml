[project]
name = "dbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.3.3",
    "waitress>=3.0.1",
    "numpy>=1.23.0",
    "psutil>=7.0.0",
    # The headless wheel lacks the Media Foundation (MSMF) camera backend on Windows, leaving only
    # DirectShow. Linux boards keep it: the full wheel needs GUI libraries (libGL) they do not have.
    "opencv-python>=4.7.0.72; sys_platform != 'linux'",
    "opencv-python-headless>=4.7.0.72; sys_platform == 'linux'",
    # Both wheels provide the same "onnxruntime" module, so exactly one may be installed.
    "onnxruntime>=1.27.0; sys_platform != 'win32' or platform_machine != 'AMD64'",
    "onnxruntime-directml>=1.24.4; sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]